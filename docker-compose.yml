# Joins shared edge nginx on Docker network `web` (hosting repo).
#
# Prerequisite — start hosting stack first (creates network `web`):
#   cd ~/hosting && docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Deploy (production):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Local dev (standalone — no hosting router):
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#   → http://localhost:8082
#
# Edge routing: hosting/nginx/conf.d/primeevent.conf

services:
  prime-event-wedding:
    build: .
    container_name: prime-event-wedding
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - web

networks:
  web:
    external: true
    name: web
